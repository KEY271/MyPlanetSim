name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: dev
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: dev
          - name: Clang Release
            cc: clang
            cxx: clang++
            preset: release
          - name: Clang ASan UBSan
            cc: clang
            cxx: clang++
            preset: asan-ubsan

    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-format

      - name: Report toolchain
        run: |
          cmake --version
          ninja --version
          "$CXX" --version
          clang-format --version

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"

      - name: Check formatting
        if: matrix.name == 'Clang Debug'
        run: cmake --build build/dev --target format-check
