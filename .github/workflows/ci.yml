name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        run: npm ci --prefix web
      - name: Check Web workspace
        run: npm run lint --prefix web && npm run typecheck --prefix web && npm test --prefix web && npm run build --prefix web

  live:
    name: Native gateway live path
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the simulator
        run: cmake --preset dev && cmake --build --preset dev
      - name: Install Web dependencies
        run: npm ci --prefix web
      # Exercises the FrameV1 shallow-water run and the FrameV2 dry hydrostatic run against
      # the binary that was just built, including preset restrictions and cancellation.
      - name: Run the live gateway gate
        run: npm run test:live --prefix web --workspace @myplanetsim/gateway
      - name: Install Chromium
        run: npx --prefix web playwright install --with-deps chromium
      # Node accepts API shapes a browser rejects and never renders, so the viewer is also
      # opened in a real browser against the gateway that was just started.
      - name: Run the browser gate
        run: npm run test:browser --prefix web --workspace @myplanetsim/ui

  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: dev
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: dev
          - name: Clang Release
            cc: clang
            cxx: clang++
            preset: release
          - name: Clang ASan UBSan
            cc: clang
            cxx: clang++
            preset: asan-ubsan

    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install --yes ninja-build clang-format

      - name: Report toolchain
        run: |
          cmake --version
          ninja --version
          "$CXX" --version
          clang-format --version

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"

      - name: Check formatting
        if: matrix.name == 'Clang Debug'
        run: cmake --build build/dev --target format-check
