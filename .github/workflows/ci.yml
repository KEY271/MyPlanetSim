name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  web:
    name: Web workspace
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install Web dependencies
        run: npm ci --prefix web
      - name: Check Web workspace
        run: npm run lint --prefix web && npm run typecheck --prefix web && npm test --prefix web && npm run build --prefix web

  dataset-contract:
    name: C++ to TypeScript dataset contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build the simulator
        run: cmake --preset dev && cmake --build --preset dev
      - name: Install Web dependencies
        run: npm ci --prefix web
      - name: Generate the Phase 15 fixture
        run: ./build/dev/my_planet_sim --config configs/phase15_viewer_rest_n4.cfg --progress-interval-s 0
      - name: Decode the C++ dataset in TypeScript
        env:
          MPS_VISUAL_DATASET: ${{ github.workspace }}/output/phase15-viewer-rest-n4/viewer
        run: npm run test:cli-dataset --prefix web --workspace @myplanetsim/protocol

  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC Debug
            cc: gcc
            cxx: g++
            preset: dev
          - name: Clang Debug
            cc: clang
            cxx: clang++
            preset: dev
          - name: Clang Release
            cc: clang
            cxx: clang++
            preset: release
          - name: Clang ASan UBSan
            cc: clang
            cxx: clang++
            preset: asan-ubsan

    name: ${{ matrix.name }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
      ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Report toolchain
        run: |
          cmake --version
          ninja --version
          "$CXX" --version
          clang-format --version

      - name: Configure
        run: cmake --preset "${{ matrix.preset }}"

      - name: Build
        run: cmake --build --preset "${{ matrix.preset }}"

      - name: Test
        run: ctest --preset "${{ matrix.preset }}"

      - name: Check formatting
        if: matrix.name == 'Clang Debug'
        run: cmake --build build/dev --target format-check
